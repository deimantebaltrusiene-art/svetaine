<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dalelės, kurios tampa žodžiais</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* Fonas: pagrindinė žalia, centre šviesesnė, kraštuose tamsesnė */
  body { background: radial-gradient(ellipse 75% 65% at 50% 48%, #1b7a5d 0%, #12614a 45%, #0b3d2f 100%); }
  canvas { display: block; touch-action: pan-y; }
</style>
</head>
<body>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ====== Čia keisk žodžius ir nustatymus ======
const ZODZIAI = [['SĄSKAITOS'], ['KARUSELĖS'], ['SVETAINĖS'], ['CLAUDE', 'CODE']];
const KIEKIS = 11000;          // kiek dalelių
const LAIKYTI = 2.6;          // kiek sekundžių žodis stovi
const ORANZINIU_DALIS = 0.22; // kokia dalis dalelių oranžinės
// =============================================

const capture = new URLSearchParams(location.search).has('capture');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: capture });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 100);
camera.position.set(0, 0, 10);
const grupe = new THREE.Group();
scene.add(grupe);

// ---- Žodžių taškai iš Bebas Neue šrifto ----
await document.fonts.load('400 200px "Bebas Neue"', 'SĄSKAITOSKARUSELĖSVETAINĖCLUDE');

function zodzioTaskai(eilutes) {
  const H = 260, tarpas = 0.9;
  const c = document.createElement('canvas');
  c.width = 2600; c.height = Math.round(H * (eilutes.length * tarpas + 0.4));
  const x = c.getContext('2d', { willReadFrequently: true });
  x.fillStyle = '#fff';
  x.font = `400 ${H}px "Bebas Neue", Impact, sans-serif`;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  eilutes.forEach((e, i) => x.fillText(e, c.width / 2, H * (0.2 + tarpas * (i + 0.55))));
  const d = x.getImageData(0, 0, c.width, c.height).data;
  const t = [];
  for (let py = 0; py < c.height; py += 3) for (let px = 0; px < c.width; px += 3) {
    if (d[(py * c.width + px) * 4 + 3] > 140) t.push([px, py]);
  }
  // Sumaišom, kad pereinant dalelės skristų iš skirtingų vietų
  for (let i = t.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [t[i], t[j]] = [t[j], t[i]]; }
  let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
  t.forEach(([a, b]) => { x0 = Math.min(x0, a); x1 = Math.max(x1, a); y0 = Math.min(y0, b); y1 = Math.max(y1, b); });
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  return { taskai: t.map(([a, b]) => [a - cx, cy - b]), plotis: x1 - x0, aukstis: y1 - y0 };
}
const formos = ZODZIAI.map(zodzioTaskai);

// ---- Dalelės ----
const poz = new Float32Array(KIEKIS * 3);
const greitis = new Float32Array(KIEKIS * 3);
const tikslas = new Float32Array(KIEKIS * 3);
const spalvos = new Float32Array(KIEKIS * 3);
const dydziai = new Float32Array(KIEKIS);
const kremine = new THREE.Color('#efe6dd'), oranzine = new THREE.Color('#f78a09');
for (let i = 0; i < KIEKIS; i++) {
  poz[i * 3] = (Math.random() - 0.5) * 14;
  poz[i * 3 + 1] = (Math.random() - 0.5) * 9;
  poz[i * 3 + 2] = (Math.random() - 0.5) * 8;
  const s = Math.random() < ORANZINIU_DALIS ? oranzine : kremine;
  spalvos.set([s.r, s.g, s.b], i * 3);
  dydziai[i] = 0.7 + Math.random() * 0.6;
}
const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(poz, 3));
geo.setAttribute('spalva', new THREE.BufferAttribute(spalvos, 3));
geo.setAttribute('dydis', new THREE.BufferAttribute(dydziai, 1));

const medziaga = new THREE.ShaderMaterial({
  uniforms: { uDydis: { value: 3 } },
  vertexShader: `
    attribute vec3 spalva;
    attribute float dydis;
    uniform float uDydis;
    varying vec3 vSpalva;
    void main() {
      vSpalva = spalva;
      vec4 mv = modelViewMatrix * vec4(position, 1.0);
      gl_PointSize = uDydis * dydis * (10.0 / -mv.z);
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: `
    varying vec3 vSpalva;
    void main() {
      float d = length(gl_PointCoord - 0.5);
      float a = smoothstep(0.5, 0.05, d);
      gl_FragColor = vec4(vSpalva * a, a);
    }`,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
});
grupe.add(new THREE.Points(geo, medziaga));

// ---- Kadras: žodis užima tiek pat vietos bet kokio dydžio kortelėje ----
let matomasPlotis = 1, matomasAukstis = 1;
function kadruok() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  matomasAukstis = 2 * camera.position.z * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  matomasPlotis = matomasAukstis * camera.aspect;
  medziaga.uniforms.uDydis.value = Math.max(2.4, h / 150) * renderer.getPixelRatio();
  nustatykTiksla(dabartinis, false);
}

let dabartinis = capture ? formos.length - 1 : 0;
function nustatykTiksla(k, sprogti) {
  const f = formos[k];
  const mastelis = Math.min(matomasPlotis * (camera.aspect < 1 ? 0.88 : 0.84) / f.plotis, matomasAukstis * 0.62 / f.aukstis);
  for (let i = 0; i < KIEKIS; i++) {
    const [a, b] = f.taskai[i % f.taskai.length];
    tikslas[i * 3] = a * mastelis;
    tikslas[i * 3 + 1] = b * mastelis + matomasAukstis * 0.03;
    tikslas[i * 3 + 2] = (Math.random() - 0.5) * 0.18;
    if (sprogti) {
      // Dalelės išlekia į erdvę ir tik tada skrenda į naują žodį
      const kampas = Math.random() * Math.PI * 2, stiprumas = 0.08 + Math.random() * 0.22;
      greitis[i * 3] += Math.cos(kampas) * stiprumas;
      greitis[i * 3 + 1] += Math.sin(kampas) * stiprumas;
      greitis[i * 3 + 2] += (Math.random() - 0.3) * 0.35;
    }
  }
}

// ---- Pelė ar pirštas išstumia daleles ----
const pele = new THREE.Vector2(99, 99);
let peleAktyvi = false;
const spindulys = new THREE.Raycaster(), plokstuma = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0), taskas = new THREE.Vector3();
const pelesVieta = new THREE.Vector3(99, 99, 0);
let paskutinisJudesys = -10;
function judinti(e) {
  pele.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  peleAktyvi = true;
  paskutinisJudesys = performance.now() / 1000;
}
addEventListener('pointermove', judinti);
addEventListener('pointerdown', judinti);
document.documentElement.addEventListener('mouseleave', () => { peleAktyvi = false; });
addEventListener('blur', () => { peleAktyvi = false; });
addEventListener('pointerup', e => { if (e.pointerType !== 'mouse') peleAktyvi = false; });

// ---- Judėjimas ----
const laikrodis = new THREE.Clock();
let paskutinisKeitimas = 0, pasvirimasX = 0, pasvirimasY = 0;

function zingsnis() {
  const t = laikrodis.getElapsedTime();
  if (t - paskutinisKeitimas > LAIKYTI + 1.2) {
    paskutinisKeitimas = t;
    dabartinis = (dabartinis + 1) % formos.length;
    nustatykTiksla(dabartinis, true);
  }

  // Pelė pamirštama po sekundės ramybės, kad žodis vėl susidėtų
  if (peleAktyvi && performance.now() / 1000 - paskutinisJudesys > 1.0) peleAktyvi = false;
  // Kai pelės nėra, per žodį pats perbėga nematomas vėjelis, kad scena nuolat gyventų
  const vejelis = !peleAktyvi;
  if (vejelis) {
    const faze = (t % 5.5) / 5.5;
    pelesVieta.set((faze * 1.6 - 0.8) * matomasPlotis * 0.5, Math.sin(t * 1.7) * matomasAukstis * 0.08, 0);
  }
  if (peleAktyvi) {
    spindulys.setFromCamera(pele, camera);
    spindulys.ray.intersectPlane(plokstuma, taskas);
    grupe.worldToLocal(pelesVieta.copy(taskas));
  }
  const r = matomasAukstis * (vejelis ? 0.09 : 0.16), r2 = r * r, stumti = peleAktyvi || vejelis;
  const jegosDaugiklis = vejelis ? 0.035 : 0.09;

  for (let i = 0; i < KIEKIS; i++) {
    const j = i * 3;
    let vx = greitis[j], vy = greitis[j + 1], vz = greitis[j + 2];
    // Spyruoklė į tikslą
    vx += (tikslas[j] - poz[j]) * 0.028;
    vy += (tikslas[j + 1] - poz[j + 1]) * 0.028;
    vz += (tikslas[j + 2] - poz[j + 2]) * 0.028;
    // Pelės stūmimas
    if (stumti) {
      const dx = poz[j] - pelesVieta.x, dy = poz[j + 1] - pelesVieta.y, d2 = dx * dx + dy * dy;
      if (d2 < r2) {
        const jega = (1 - d2 / r2) * jegosDaugiklis / Math.sqrt(d2 + 0.0001);
        vx += dx * jega; vy += dy * jega; vz += 0.04 * (1 - d2 / r2);
      }
    }
    // Lengvas mirgėjimas, kad žodis kvėpuotų
    vx += Math.sin(t * 1.3 + i) * 0.0004;
    vy += Math.cos(t * 1.1 + i * 1.7) * 0.0004;
    vx *= 0.86; vy *= 0.86; vz *= 0.86;
    greitis[j] = vx; greitis[j + 1] = vy; greitis[j + 2] = vz;
    poz[j] += vx; poz[j + 1] += vy; poz[j + 2] += vz;
  }
  geo.attributes.position.needsUpdate = true;

  // Visa grupė švelniai sukasi ir pasvyra link pelės, kad matytųsi gylis
  const tx = peleAktyvi ? pele.y * 0.18 : 0, ty = peleAktyvi ? pele.x * 0.3 : Math.sin(t * 0.4) * 0.14;
  pasvirimasX += (tx - pasvirimasX) * 0.05;
  pasvirimasY += (ty - pasvirimasY) * 0.05;
  grupe.rotation.set(-pasvirimasX, pasvirimasY, 0);
  renderer.render(scene, camera);
}

kadruok();
addEventListener('resize', kadruok);

if (capture) {
  // Nuotraukai: dalelės iškart savo vietose
  poz.set(tikslas);
  geo.attributes.position.needsUpdate = true;
  grupe.rotation.set(0, 0.12, 0);
  renderer.render(scene, camera);
  window.__ready = true;
} else {
  renderer.setAnimationLoop(zingsnis);
}
</script>
</body>
</html>
